<!-- How to create a new Element two.html and three.html --> 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code</title>
</head>
<body style="background-color: #212121; color: #ffff;">
    
</body>
<script>
    const div = document.createElement('div'); // created an element 
    console.log(div)
    // add attributes to the element 
    div.className = "main"
    div.id = "myid"
    div.setAttribute("title", "genrated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Haa bhai sab sahi" // dev not prefer this because it overrides the value 
    const addText = document.createTextNode("haa bhai sab sahi") // devs prefer this

    // we have done all this but it's not displaying on the page 
    // because it is right now in memory it will shows when attach 
    // the div to the document  

    div.appendChild(addText) // add the node to the div
    // now add or attach to the document 
    document.body.appendChild(div);

</script>
</html>
