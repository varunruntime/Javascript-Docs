title.innerHTML => displays all the text content including html tags 
title.innerText => displays content that is only visible on the page 

document.querySelector('h2') => query selector always give the first element from the document even if there is more 
document.querySelector('#title')  => Find the first element that matches the CSS selector #title.
document.querySelector('.heading') => Find the first element that matches the CSS selector .heading.”
document.querySelector('input[type = "password"]') => Find the first <input> element whose type is "password".”
[type = "password"] this is called a attribute selector in CSS 
querySelector() returns only the first matching element.

Always remember nodeList and Html collection is not an array although we can convert them in array
